name: Initialize Database

on:
  push:
    branches: [ main ]  # 当推送到 main 分支时触发

jobs:
  init-db:
    runs-on: ubuntu-latest  # 使用最新版的 Ubuntu 环境运行

    steps:
      # 步骤1：将你的仓库代码拉取到运行环境中
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：设置 Python 环境，这里以 Python 3.10 为例
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      # 步骤3：运行你的 database.py 脚本
      - name: Run database.py
        run: python database.py