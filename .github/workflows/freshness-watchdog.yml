name: Freshness Watchdog

on:
  schedule:
    - cron: '30 15 * * *'   # 23:30 MYT（留 1.5h 缓冲）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 check_freshness.py
