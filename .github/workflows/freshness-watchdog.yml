name: Freshness Watchdog

on:
  schedule:
    - cron: '10 14 * * *'   # 22:10 MYT
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 check_freshness.py
