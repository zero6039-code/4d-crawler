name: Daily 4D Crawler

on:
  # 备用兜底；主触发仍为 cron-job.org 的 workflow_dispatch
  schedule:
    - cron: '15 11 * * *'     # 19:15 MYT
    - cron: '45 12 * * *'     # 20:45 MYT
  workflow_dispatch:

concurrency:
  group: 4d-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show start time
        run: echo "运行时间 $(TZ='Asia/Kuala_Lumpur' date)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run crawler
        run: python crawler.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update 4D results $(TZ='Asia/Kuala_Lumpur' date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
