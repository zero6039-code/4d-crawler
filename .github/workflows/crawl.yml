name: Trigger Crawler on Render

on:
  schedule:
    # 马来西亚时间 19:00–19:59 = UTC 11:00–11:59，每5分钟运行一次
    - cron: '*/5 11 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render crawler endpoint
        run: |
          curl -X GET "https://fourd-crawler.onrender.com/api/trigger-crawler?secret=${{ secrets.CRAWLER_SECRET }}"
