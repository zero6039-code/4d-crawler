<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4D 成绩 Malaysia · 实时更新</title>
    <link rel="icon" type="image/png" href="/my4d.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        /* ==================== 全局变量 ==================== */
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-sub: #718096;
            --primary: #3182ce;
            --accent: #f59e0b;
            --danger: #e53e3e;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        /* 深夜模式配置 */
        [data-theme="dark"] {
            --bg: #1a202c;
            --card-bg: #2d3748;
            --text-main: #edf2f7;
            --text-sub: #a0aec0;
            --primary: #63b3ed;
            --border: #4a5568;
        }

        /* ==================== 基础布局 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text-main); transition: background 0.3s; padding-bottom: 50px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }

        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #2c5282); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* ==================== 导航工具栏 ==================== */
        .toolbar { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; 
            position: sticky; top: 10px; z-index: 100;
        }
        .btn { 
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); 
            background: var(--card-bg); color: var(--text-main); cursor: pointer; 
            font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 5px;
            transition: all 0.2s; box-shadow: var(--shadow); text-decoration: none;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-accent { background: var(--accent); color: white; border: none; }
        .btn-success { background: #10b981; color: white; border: none; }

        /* ==================== 成绩卡片样式 ==================== */
        .companies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 15px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .company-info { display: flex; align-items: center; gap: 10px; }
        .company-logo { height: 35px; width: auto; object-fit: contain; }
        .draw-info { font-size: 0.75rem; color: var(--text-sub); text-align: right; }

        .prize-main { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
        .prize-row-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .prize-box { background: var(--bg); padding: 10px 5px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .prize-label { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .prize-num { font-size: 1.5rem; font-weight: 800; color: var(--danger); font-family: 'Courier New', monospace; }
        
        .prize-sub-title { font-size: 0.85rem; font-weight: 700; margin: 12px 0 8px; display: flex; align-items: center; gap: 5px; }
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .num-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 2px; text-align: center; font-size: 0.9rem; font-weight: 600; font-family: monospace; }

        /* ==================== 弹窗系统 ==================== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 1.5rem; cursor: pointer; color: var(--text-sub); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); font-size: 1rem; }

        /* ==================== 响应式微调 ==================== */
        @media (max-width: 600px) {
            .companies-grid { grid-template-columns: 1fr; }
            .prize-num { font-size: 1.3rem; }
            h1 { font-size: 1.4rem; }
            .btn { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MY 4D RESULT LIVE</h1>
    </header>

    <div class="toolbar">
        <button class="btn" onclick="toggleTheme()" id="theme-toggle">🌙 深夜模式</button>
        <button class="btn" onclick="forceRefresh()">🔄 刷新数据</button>
        <button class="btn btn-accent" onclick="openModal('lucky')">🎰 幸运号码</button>
        <button class="btn btn-primary" onclick="openModal('betting')">🎲 模拟下注</button>
        <button class="btn btn-success" onclick="openModal('donate')">❤️ 支持作者</button>
        <a href="/my4d.apk" class="btn">📦 APK 下载</a>
    </div>

    <div id="companies-grid" class="companies-grid">
        <p style="text-align: center; grid-column: 1/-1;">正在连接服务器同步开彩结果...</p>
    </div>

    <footer style="text-align: center; margin-top: 40px; color: var(--text-sub); font-size: 0.8rem;">
        <p>⚠️ 结果仅供参考，请以官方公告为准</p>
        <p id="update-time">最后更新: --:--:--</p>
    </footer>
</div>

<div id="modal-lucky" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAllModals()">&times;</span>
        <h2 style="text-align: center; margin-bottom: 20px;">✨ 财运号码 ✨</h2>
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
            <div id="digit-1" class="prize-box" style="width: 60px; font-size: 2rem; font-weight: 800;">0</div>
            <div id="digit-2" class="prize-box" style="width: 60px; font-size: 2rem; font-weight: 800;">0</div>
            <div id="digit-3" class="prize-box" style="width: 60px; font-size: 2rem; font-weight: 800;">0</div>
            <div id="digit-4" class="prize-box" style="width: 60px; font-size: 2rem; font-weight: 800;">0</div>
        </div>
        <button class="btn btn-accent" style="width: 100%; justify-content: center; padding: 15px;" onclick="spinLucky()">开始摇号</button>
    </div>
</div>

<div id="modal-betting" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAllModals()">&times;</span>
        
        <div id="bet-login-view">
            <h2 style="margin-bottom: 15px;">会员登录</h2>
            <div class="form-group"><input type="text" id="login-user" placeholder="用户名"></div>
            <div class="form-group"><input type="password" id="login-pass" placeholder="密码"></div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="handleLogin()">登录 / 注册</button>
        </div>

        <div id="bet-main-view" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="display-username">玩家</h3>
                <span style="color: var(--accent); font-weight: 700;">余额: <span id="display-balance">0</span> RM</span>
            </div>
            <div class="form-group">
                <label>选择公司</label>
                <select id="bet-comp">
                    <option value="Magnum">Magnum 4D</option>
                    <option value="Damacai">Damacai 1+3D</option>
                    <option value="Toto">Sports Toto</option>
                </select>
            </div>
            <div class="form-group">
                <label>4D 号码</label>
                <input type="text" id="bet-num" maxlength="4" placeholder="例如: 8888">
            </div>
            <div class="form-group">
                <label>下注金额 (RM)</label>
                <input type="number" id="bet-amt" value="1" min="1">
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="submitBet()">确认下注</button>
            <button class="btn" style="width: 100%; margin-top: 10px; justify-content: center;" onclick="handleLogout()">退出登录</button>
        </div>
    </div>
</div>

<div id="modal-donate" class="modal">
    <div class="modal-content" style="text-align: center;">
        <span class="close-btn" onclick="closeAllModals()">&times;</span>
        <h2>感谢支持 ❤️</h2>
        <img src="images/tng_qr.jpg" alt="TNG QR" style="width: 200px; margin: 15px auto; border-radius: 10px; box-shadow: var(--shadow);">
        <p style="font-size: 0.85rem; color: var(--text-sub);">您的打赏是我更新维护的最大动力！请核对姓名：LOW KEAN WAH</p>
    </div>
</div>

<script>
    // ==================== 核心数据配置 ====================
    const COMPANIES = [
        { id: 'magnum', name: 'MAGNUM 4D', logo: 'magnum.png' },
        { id: 'damacai', name: 'DAMACAI 1+3D', logo: 'damacai.png' },
        { id: 'toto', name: 'SPORTS TOTO', logo: 'toto.png' },
        { id: 'singapore', name: 'SINGAPORE 4D', logo: 'singapore4d.png' },
        { id: 'sabah', name: 'SABAH 88', logo: 'sabah88.png' },
        { id: 'sandakan', name: 'STC 4D', logo: 'sandakan_logo.png' }
    ];

    // ==================== 初始化与主题 ====================
    function toggleTheme() {
        const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.getElementById('theme-toggle').innerText = theme === 'dark' ? '☀️ 日间模式' : '🌙 深夜模式';
    }

    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').innerText = '☀️ 日间模式';
    }

    // ==================== 数据渲染逻辑 ====================
    async function loadData() {
        const grid = document.getElementById('companies-grid');
        grid.innerHTML = ''; // 清空加载提示

        for (const comp of COMPANIES) {
            try {
                // 模拟加载最新日期的数据，实际请根据你的日期逻辑拼接 URL
                const response = await fetch(`data/latest/${comp.id}.json?t=${Date.now()}`);
                const data = response.ok ? await response.json() : getMockData(comp.name);
                renderCard(comp, data);
            } catch (e) {
                renderCard(comp, getMockData(comp.name));
            }
        }
        document.getElementById('update-time').innerText = `最后更新: ${new Date().toLocaleTimeString()}`;
    }

    function renderCard(comp, data) {
        const grid = document.getElementById('companies-grid');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <div class="company-info">
                    <img src="images/${comp.logo}" class="company-logo" onerror="this.style.display='none'">
                    <span style="font-weight:800; font-size:1.1rem;">${comp.name}</span>
                </div>
                <div class="draw-info">
                    <div>${data.draw_date || '2026-04-01'}</div>
                    <div>#${data.draw_no || '5678/26'}</div>
                </div>
            </div>
            <div class="prize-main">
                <div class="prize-row-top">
                    <div class="prize-box"><div class="prize-label">1st Prize</div><div class="prize-num">${data['1st'] || '----'}</div></div>
                    <div class="prize-box"><div class="prize-label">2nd Prize</div><div class="prize-num">${data['2nd'] || '----'}</div></div>
                    <div class="prize-box"><div class="prize-label">3rd Prize</div><div class="prize-num">${data['3rd'] || '----'}</div></div>
                </div>
            </div>
            <div class="prize-sub-title">✨ SPECIAL</div>
            <div class="num-grid">
                ${(data.special || Array(10).fill('----')).map(n => `<div class="num-item">${n}</div>`).join('')}
            </div>
            <div class="prize-sub-title">🎗️ CONSOLATION</div>
            <div class="num-grid">
                ${(data.consolation || Array(10).fill('----')).map(n => `<div class="num-item">${n}</div>`).join('')}
            </div>
        `;
        grid.appendChild(card);
    }

    function getMockData(name) {
        return { '1st': '1234', '2nd': '5678', '3rd': '9012', special: Array(10).fill('8888'), consolation: Array(10).fill('6666') };
    }

    function forceRefresh() {
        const btn = event.target;
        btn.innerText = '⌛ 同步中...';
        loadData().then(() => {
            btn.innerText = '🔄 刷新数据';
        });
    }

    // ==================== 弹窗逻辑控制 ====================
    function openModal(id) {
        document.getElementById(`modal-${id}`).style.display = 'flex';
        if (id === 'betting') checkBetStatus();
    }

    function closeAllModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    window.onclick = (e) => { if (e.target.className === 'modal') closeAllModals(); };

    // ==================== 模拟下注逻辑 ====================
    let userSession = JSON.parse(localStorage.getItem('user_session')) || null;

    function checkBetStatus() {
        const loginView = document.getElementById('bet-login-view');
        const mainView = document.getElementById('bet-main-view');
        if (userSession) {
            loginView.style.display = 'none';
            mainView.style.display = 'block';
            document.getElementById('display-username').innerText = `👤 ${userSession.username}`;
            document.getElementById('display-balance').innerText = userSession.balance;
        } else {
            loginView.style.display = 'block';
            mainView.style.display = 'none';
        }
    }

    function handleLogin() {
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        if (!user || !pass) return alert("请输入完整信息");
        
        // 模拟登录/注册：只要输入就创建账号，默认1000本金
        userSession = { username: user, balance: 1000 };
        localStorage.setItem('user_session', JSON.stringify(userSession));
        checkBetStatus();
    }

    function handleLogout() {
        userSession = null;
        localStorage.removeItem('user_session');
        checkBetStatus();
    }

    function submitBet() {
        const num = document.getElementById('bet-num').value;
        const amt = parseInt(document.getElementById('bet-amt').value);
        if (num.length !== 4) return alert("请输入4位数字");
        if (userSession.balance < amt) return alert("余额不足");

        userSession.balance -= amt;
        document.getElementById('display-balance').innerText = userSession.balance;
        localStorage.setItem('user_session', JSON.stringify(userSession));
        alert(`下注成功！单号: ${num} 金额: ${amt}RM`);
    }

    // ==================== 幸运号码逻辑 ====================
    function spinLucky() {
        const btn = event.target;
        btn.disabled = true;
        let count = 0;
        const timer = setInterval(() => {
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`digit-${i}`).innerText = Math.floor(Math.random() * 10);
            }
            count++;
            if (count > 20) {
                clearInterval(timer);
                btn.disabled = false;
            }
        }, 50);
    }

    // 页面加载启动
    loadData();
</script>

</body>
</html>
