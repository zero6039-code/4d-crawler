        .calendar-table th, .calendar-table td { width: 36px; }
        .calendar-table th { font-size: 0.8rem; font-weight: 600; color: #718096; padding: 6px 0; }
        .calendar-table td { padding: 0; height: 36px; line-height: 36px; font-size: 0.9rem; cursor: pointer; border-radius: 50%; transition: 0.1s; text-align: center; vertical-align: middle; }

        .company-section { background: white; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,20,30,0.1); margin-bottom: 0; padding: 14px 12px; border: 1px solid rgba(255,255,255,0.5); transition: transform 0.15s ease; }

        .number-item:hover { background: #e6f0ff; border-color: #8a9cb0; }
        .custom-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
        .custom-table th { background: #e2e8f0; padding: 8px 4px; text-align: center; font-weight: 600; color: #2d3748; border: 1px solid #cbd5e0; }
        .custom-table td { padding: 6px 4px; text-align: center; border: 1px solid #cbd5e0; background: white; }
        .custom-table .alt-number { color: #3182ce; font-weight: 500; }
        .group-subtitle { font-size: 0.95rem; font-weight: 600; margin: 8px 0 4px 0; color: #2c3e50; width: 100%; }
        footer { text-align: center; margin-top: 30px; color: #7c8b9c; font-size: 0.8rem; border-top: 1px solid #dbe1ea; padding-top: 16px; }
        .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-indicator.success { background: #48bb78; }
        .status-indicator.error { background: #f56565; }
        .status-indicator.loading { background: #ecc94b; animation: blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        @media (max-width: 600px) {
            .companies-grid { grid-template-columns: 1fr; }

            .company-section[data-company="damacai_1p3d"] .company-title img { height: 2.5rem; }

        .company-section[data-company="damacai"] .company-title { background: linear-gradient(145deg, #1e5620, #2a7a2d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .company-section[data-company="magnum"] .company-title { background: linear-gradient(145deg, #aa4a1e, #c95f2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .company-section[data-company="toto"] .company-title { background: linear-gradient(145deg, #b71c1c, #d32f2f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .company-section[data-company="singapore"] .company-title { background: linear-gradient(145deg, #1e4a6b, #2c6b96); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .jackpot-label { font-weight: 600; margin: 4px 0 2px 0; color: #2c3e50; font-size: 0.95rem; }
    </style>

<body>
    <div class="container">
        <h1>MY 4D RESULT MALAYSIA</h1>
        
        <div class="top-calendar">
            <button class="calendar-btn" id="calendar-btn"></button>
            <div id="calendar-popup" class="calendar-popup" style="display: none;"></div>
        </div>
        
        <div class="bottom-row">
            <div class="date-dropdown" id="date-dropdown">
                <button class="date-btn" id="date-btn" onclick="toggleDateDropdown()">
                    <span id="selected-date">加载中...</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="date-dropdown-content" id="date-dropdown-content">
                    <div class="loading-history">🔄 加载历史数据...</div>

            </div>

        </div>

        <div id="companies-grid" class="companies-grid">
            <p style="text-align: center; grid-column: 1/-1; color: #666;">🔄 正在加载数据...</p>
        </div>

        <footer>
            ⚠️ 数据仅供参考，请以官方公告为准。<br>
            <span id="status-text">
                <span class="status-indicator loading"></span>正在加载...
            </span>
            <br>
            更新于 <span id="update-time">-</span>
        </footer>
    </div>

    <script>
        // ==================== 配置 ====================
        const COMPANY_LIST = [
            'grand_dragon',
            'damacai', 'magnum', 'toto', 'singapore', 'damacai_1p3d',
            'sandakan', 'sarawak_cashsweep', 'sabah', 'sabah_lotto',
            'singapore_toto', 'sportstoto_lotto',
            'magnum_jackpot_gold', 'sportstoto_5d', 'sportstoto_6d',
            'magnum_life', 'sportstoto_fireball'
        ];

        const NAME_MAP = {
            'grand_dragon': 'GRAND DRAGON 豪龙',
            'damacai': 'DAMACAI 4D',
            'magnum': 'MAGNUM 4D',
            'toto': 'TOTO 4D',
            'singapore': 'SINGAPORE 4D',
            'damacai_1p3d': 'DAMACAI 1+3D',
            'sandakan': 'SANDAKAN 4D',
            'sarawak_cashsweep': 'SARAWAK CASHSWEEP',
            'sabah': 'SABAH 88 4D',
            'sabah_lotto': 'SABAH LOTTO',
            'singapore_toto': 'SINGAPORE TOTO',
            'sportstoto_lotto': 'SPORTS TOTO LOTTO',
            'magnum_jackpot_gold': 'MAGNUM JACKPOT GOLD',
            'sportstoto_5d': 'SPORTS TOTO 5D',
            'sportstoto_6d': 'SPORTS TOTO 6D',
            'magnum_life': 'MAGNUM LIFE',
            'sportstoto_fireball': 'SPORTS TOTO FIREBALL'
        };

        const SPECIAL_COMPANIES = [
            'sportstoto_fireball', 'singapore_toto',
            'magnum_jackpot_gold', 'sportstoto_5d', 'sportstoto_6d', 'magnum_life'
        ];

        const COMPANY_IMAGE_MAP = {
            'damacai': 'damacai.png',
            'damacai_1p3d': 'damacai1+3.png',
            'sandakan': 'sandakan_logo.png',
            'sarawak_cashsweep': 'sarawak.png',
            'sabah': 'sabah88.png',
            'sabah_lotto': 'sabahlotto.png',
            'grand_dragon': 'granddragon.png',
            'magnum': 'magnum.png',
            'toto': 'toto.png',
            'singapore': 'singapore4d.png',
            'singapore_toto': 'singapore-pools.png'
        };

        // 隐藏公司列表（隐藏 sportstoto_fireball）
        const HIDDEN_COMPANIES = [
            'sportstoto_fireball'
        ];

        // 用于日历高亮的公司（排除豪龙和 Singapore Toto）
        const CALENDAR_CHECK_COMPANIES = [
            'damacai', 'magnum', 'toto', 'singapore', 'damacai_1p3d',
            'sandakan', 'sarawak_cashsweep', 'sabah'
        ];

        let availableDates = [];           
        let availableDatesSet = new Set(); 
        let filteredDates = [];             
        let filteredDatesSet = new Set();
        let selectedDate = null;           

        // ==================== 工具函数 ====================
        function ymdToDmy(ymd) {
            if (!ymd) return '';
            let parts = ymd.split('-');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return ymd;
        }

        function dmyToYmd(dmy) {
            if (!dmy) return '';
            let parts = dmy.split('-');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dmy;
        }

        function parseDMY(dateStr) {
            let parts = dateStr.split('-');
            let d, m, y;
            if (parts[0].length === 4) {
                [y, m, d] = parts.map(Number);
            } else {
                [d, m, y] = parts.map(Number);
            }
            return { year: y, month: m, day: d };
        }

        function toSortKey(dateStr) {
            let { year, month, day } = parseDMY(dateStr);
            return year * 10000 + month * 100 + day;
        }

        function sortDatesDesc(dates) {
            return dates.sort((a, b) => toSortKey(b) - toSortKey(a));
        }

        // 格式化日期为 "dd-mm-yyyy 星期几"
        function formatDisplayDate(dateStr) {
            if (!dateStr) return '加载中...';
            let dmy = ymdToDmy(dateStr);
            let parts = dmy.split('-');
            let d = new Date(parts[2], parts[1]-1, parts[0]);
            let weekday = d.toLocaleDateString('en-US', { weekday: 'short' });
            return `${dmy} ${weekday}`;
        }

        // ==================== 日期选择器 ====================
        function toggleDateDropdown() {
            document.getElementById('date-dropdown').classList.toggle('show');
            document.getElementById('date-btn').classList.toggle('active');
        }

        async function loadDateIndex() {
            try {
                const res = await fetch(`data/dates.json?t=${Date.now()}`, { cache: 'no-store' });
                if (res.ok) {
                    let dates = await res.json();
                    availableDates = sortDatesDesc(dates);
                    availableDatesSet = new Set(availableDates);
                    
                    await generateFilteredDates();
                    
                    if (filteredDates.length > 0) {
                        selectedDate = filteredDates[0];
                    } else if (availableDates.length > 0) {
                        selectedDate = availableDates[0];
                    }
                    console.log('📅 初始 selectedDate:', selectedDate);
                    console.log('📅 所有可用日期:', availableDates);
                }
            } catch (e) { console.warn('无法加载 dates.json', e); }
            renderDateDropdown();
            updateDateBtnWithLatest();
            updateCalendarButtonDate(); // 更新顶部日历按钮
        }

        async function generateFilteredDates() {
            filteredDates = [];
            const concurrency = 5;
            for (let i = 0; i < availableDates.length; i += concurrency) {
                const batch = availableDates.slice(i, i + concurrency);
                const batchPromises = batch.map(async (date) => {
                    const hasData = await checkDateHasData(date);
                    return { date, hasData };
                });
                const results = await Promise.all(batchPromises);
                results.forEach(result => {
                    if (result.hasData) {
                        filteredDates.push(result.date);
                    }
                });
            }
            filteredDatesSet = new Set(filteredDates);
            console.log('过滤后的日期 (8家公司有数据):', filteredDates);
        }

        async function checkDateHasData(dateYmd) {
            const checkPromises = CALENDAR_CHECK_COMPANIES.map(async (company) => {
                const url = `data/${dateYmd}/${company}.json`;
                try {
                    const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
                    return res.ok;
                } catch {
                    return false;
                }
            });
            const results = await Promise.all(checkPromises);
            return results.some(hasData => hasData === true);
        }

        function updateDateBtnWithLatest() {
            const btnSpan = document.getElementById('selected-date');
            if (selectedDate) {
                btnSpan.innerText = ymdToDmy(selectedDate);
            } else if (filteredDates.length > 0) {
                btnSpan.innerText = ymdToDmy(filteredDates[0]);
            } else if (availableDates.length > 0) {
                btnSpan.innerText = ymdToDmy(availableDates[0]);
            } else {
                btnSpan.innerText = '暂无数据';
            }
        }

        function renderDateDropdown() {
            const content = document.getElementById('date-dropdown-content');
            if (filteredDates.length === 0) {
                content.innerHTML = '<div class="loading-history">暂无历史数据</div>';
                return;
            }
            const recentDates = filteredDates.slice(0, 5);
            let html = '<div class="date-option" onclick="selectDate(null)">📌 最新数据</div>';
            recentDates.forEach(date => {
                const activeClass = (selectedDate === date) ? 'active' : '';
                const displayDate = ymdToDmy(date);
                html += `<div class="date-option ${activeClass}" onclick="selectDate('${date}')">📅 ${displayDate}</div>`;
            });
            content.innerHTML = html;
        }

        function selectDate(date) {
            if (selectedDate === date) return;
            selectedDate = date;
            updateDateBtnWithLatest();
            updateCalendarButtonDate(); // 更新顶部日历按钮
            document.getElementById('date-dropdown').classList.remove('show');
            document.getElementById('date-btn').classList.remove('active');
            document.getElementById('calendar-popup').style.display = 'none';
            loadAllCompanies(); 
        }

        // ==================== 日历 ====================
        let currentCalendarYear, currentCalendarMonth;

        function showCalendar() {
            const popup = document.getElementById('calendar-popup');
            if (popup.style.display === 'block') {
                popup.style.display = 'none';
                return;
            }
            const now = new Date();
            currentCalendarYear = now.getFullYear();
            currentCalendarMonth = now.getMonth() + 1;
            renderCalendar();
            popup.style.display = 'block';
        }

        async function renderCalendar() {
            const popup = document.getElementById('calendar-popup');
            if (!popup) return;
            let year = currentCalendarYear;
            let month = currentCalendarMonth;
            const monthNamesEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const monthNamesZh = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            const weekdaysEn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let firstDay = new Date(year, month - 1, 1).getDay();
            let daysInMonth = new Date(year, month, 0).getDate();
            const now = new Date();
            const todayYmd = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}`;
            
            let html = `
                <div class="calendar-header">
                    <button class="calendar-nav" id="prev-month">◀</button>
                    <span class="calendar-month-year">${monthNamesEn[month-1]} ${monthNamesZh[month-1]} ${year}</span>
                    <button class="calendar-nav" id="next-month">▶</button>
                </div>
                <table class="calendar-table">
                    <thead><tr>${weekdaysEn.map(d => `<th>${d}</th>`).join('')}</tr></thead>
                    <tbody>
            `;
            
            let date = 1;
            for (let i = 0; i < 6; i++) {
                html += '<tr>';
                for (let j = 0; j < 7; j++) {
                    if ((i === 0 && j < firstDay) || date > daysInMonth) {
                        html += '<td class="empty"></td>';
                    } else {
                        let dateYmd = `${year}-${month.toString().padStart(2,'0')}-${date.toString().padStart(2,'0')}`;
                        let hasData = filteredDatesSet.has(dateYmd);
                        let isSelected = (selectedDate === dateYmd) ? 'selected' : '';
                        let isToday = (dateYmd === todayYmd) ? 'today' : '';
                        html += `<td class="${hasData ? 'has-data' : ''} ${isSelected} ${isToday}" onclick="calendarDateClick('${dateYmd}')">${date}</td>`;
                        date++;
                    }
                }
                html += '</tr>';
                if (date > daysInMonth) break;
            }
            html += '</tbody></table>';
            popup.innerHTML = html;
            
            document.getElementById('prev-month').onclick = (e) => { e.stopPropagation(); changeMonth(-1); };
            document.getElementById('next-month').onclick = (e) => { e.stopPropagation(); changeMonth(1); };
        }

        function changeMonth(delta) {
            currentCalendarMonth += delta;
            if (currentCalendarMonth > 12) { currentCalendarMonth = 1; currentCalendarYear++; }
            else if (currentCalendarMonth < 1) { currentCalendarMonth = 12; currentCalendarYear--; }
            renderCalendar();
        }

        function calendarDateClick(dateYmd) {
            if (availableDatesSet.has(dateYmd)) {
                selectDate(dateYmd);
            } else {
                alert('该日期无开彩数据');
            }
        }

        // ==================== 核心数据加载 ====================
        async function loadCompanyData(companyKey) {
            let localData = await loadFromLocalCache(companyKey, selectedDate);
            if (localData) {
                renderCompanyCard(companyKey, localData);
            } else {
                renderCompanyCard(companyKey, null);
            }
        }

        // ★★★ 修复后的 loadFromLocalCache 函数：豪龙主页始终使用最新日期 ★★★
        async function loadFromLocalCache(companyKey, date = null) {
            let startDate;
            
            if (companyKey === 'grand_dragon' && !date) {
                // 主页豪龙：始终使用最新日期
                startDate = availableDates[0];
                console.log(`🔍 豪龙主页模式：从最新日期 ${startDate} 开始查找`);
            } else {
                // 其他公司或历史查询：使用传入的 date 或全局 selectedDate
                startDate = date || selectedDate;
                console.log(`📅 加载 ${companyKey} 日期: ${startDate || '无'}`);
            }

            if (!startDate) {
                // 尝试从根目录加载（最新文件）
                try {
                    const url = `data/${companyKey}.json?t=${Date.now()}`;
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                } catch (e) {
                    console.warn(`加载根目录失败: ${companyKey}`, e);
                }
                return null;
            }

            if (availableDates.length === 0) return null;
            const startIndex = availableDates.indexOf(startDate);
            if (startIndex === -1) {
                console.warn(`起始日期 ${startDate} 不在 availableDates 中`);
                return null;
            }

            const candidateDates = availableDates.slice(startIndex);
            const maxAttempts = 10;
            for (let i = 0; i < Math.min(candidateDates.length, maxAttempts); i++) {
                const candidateDate = candidateDates[i];
                const url = `data/${candidateDate}/${companyKey}.json?t=${Date.now()}`;
                console.log(`尝试加载: ${url}`);
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        console.log(`✅ 从本地加载成功: ${url} (回退到 ${candidateDate})`);
                        return data;
                    } else {
                        console.warn(`加载失败 (${res.status}): ${url}`);
                    }
                } catch (e) {
                    console.warn(`加载异常: ${url}`, e);
                }
            }
            return null;
        }

        // 辅助函数：过滤无效号码
        function filterValidNumbers(arr) {
            if (!Array.isArray(arr)) return [];
            return arr.filter(num => num && num !== '----' && num !== '****' && num !== '***' && /^\d{4}$/.test(num));
        }

        // 渲染卡片
        function renderCompanyCard(companyKey, data) {
            const contentDiv = document.getElementById(`content-${companyKey}`);
            const metaDiv = document.getElementById(`meta-${companyKey}`);
            if (!data) {
                contentDiv.innerHTML = '<p style="text-align:center;color:#d32f2f;">无数据</p>';
                metaDiv.innerText = '日期 Date: -- | 期号 Draw Date: --';
                return;
            }
            
            let dateStr = data.draw_date || '';
            let drawNoStr = data.draw_no || data.drawNo || data.draw_number || data.drawNumber || data.no || '';
            
            let metaText = `日期 Date: ${dateStr || '--'} | 期号 Draw Date: ${drawNoStr || '--'}`;
            if (data._isFallback && selectedDate) metaText += ` (最近一期)`;
            metaDiv.innerText = metaText;

            let html = '';

            if (SPECIAL_COMPANIES.includes(companyKey)) {
                if (companyKey === 'singapore_toto') {
                    let winningNumbers = data.winning_numbers || data.numbers || data.winning || data.wins || [];
                    html += `<div class="subsection"><div class="subsection-title">开奖号码</div><div class="number-list" id="winning-${companyKey}">`;
                    winningNumbers.forEach(n => html += `<span class="number-item">${n}</span>`);
                    html += `</div></div>`;
                    
                    let prizeTable = data.prize_table || data.prizes || data.prizeTable || data.prize_table_data || [];
                    if (prizeTable && prizeTable.length > 0) {
                        html += `<div class="subsection"><div class="subsection-title">奖金分配</div><table class="custom-table"><tr><th>Prize Group</th><th>Amount</th><th>Winners</th></tr>`;
                        prizeTable.forEach(row => {
                            if (Array.isArray(row)) {
                                html += `<tr><td>${row[0] || ''}</td><td>${row[1] || ''}</td><td>${row[2] || ''}</td></tr>`;
                            } else if (typeof row === 'object') {
                                let group = row.group || row.prize || row.Prize || row.name || '';
                                let amount = row.amount || row.Amount || row.prize_amount || row.value || '';
                                let winners = row.winners || row.Winners || row.winner_count || '';
                                html += `<tr><td>${group}</td><td>${amount}</td><td>${winners}</td></tr>`;
                            }
                        });
                        html += `</table></div>`;
                    }
                } else {
                    html = '<p style="text-align:center; padding:10px;">特殊开彩详见官网</p>';
                }
            } else {
                if (companyKey === 'sabah_lotto') {
                    html = `<div class="subsection"><div class="subsection-title">开奖号码</div><div class="number-list" id="winning-${companyKey}">`;
                    const winning = data.winning_numbers || [];
                    if (winning.length === 0) {
                        for (let i = 0; i < 7; i++) html += '<span class="number-item">----</span>';
                    } else {
                        winning.forEach(n => html += `<span class="number-item">${n}</span>`);
                    }
                    html += `</div></div>`;
                    html += `<div class="subsection"><div class="subsection-title">Jackpot 1</div><div class="number-list">`;
                    html += data.jackpot1 ? `<span class="number-item">RM ${data.jackpot1}</span>` : '<span class="number-item">----</span>';
                    html += `</div></div>`;
                    html += `<div class="subsection"><div class="subsection-title">Jackpot 2</div><div class="number-list">`;
                    html += data.jackpot2 ? `<span class="number-item">RM ${data.jackpot2}</span>` : '<span class="number-item">----</span>';
                    html += `</div></div>`;
                } else if (companyKey === 'sportstoto_lotto') {
                    html = '';
                    html += `<div class="subsection"><div class="subsection-title">Star Toto 6/50</div><div class="number-list">`;
                    if (data.star && data.star.length) {
                        data.star.forEach(n => html += `<span class="number-item">${n}</span>`);
                    } else {
                        html += '<span class="number-item">----</span>';
                    }
                    html += `</div></div>`;
                    html += `<div class="subsection"><div class="subsection-title">Power Toto 6/55</div><div class="number-list">`;
                    if (data.power && data.power.length) {
                        data.power.forEach(n => html += `<span class="number-item">${n}</span>`);
                    } else {
                        html += '<span class="number-item">----</span>';
                    }
                    html += `</div></div>`;
                    html += `<div class="subsection"><div class="subsection-title">Supreme Toto 6/58</div><div class="number-list">`;
                    if (data.supreme && data.supreme.length) {
                        data.supreme.forEach(n => html += `<span class="number-item">${n}</span>`);
                    } else {
                        html += '<span class="number-item">----</span>';
                    }
                    html += `</div></div>`;
                    if (data.jackpots && data.jackpots.length) {
                        html += `<div class="subsection"><div class="subsection-title">Jackpots</div><div class="number-list">`;
                        data.jackpots.forEach((jp, idx) => {
                            if (jp) html += `<span class="number-item">RM ${jp}</span>`;
                        });
                        html += `</div></div>`;
                    }
                } else {
                    // 标准 4D 公司
                    html = `
                        <div class="prize-grid" style="flex-direction:column;align-items:center;">
                            <div class="prize-card" style="width:220px;margin-bottom:8px;"><div class="label">1st Prize</div><div class="number" id="first-${companyKey}">${data['1st'] || data.first || data.prize1 || '----'}</div></div>
                            <div style="display:flex;gap:8px;width:100%;">
                                <div class="prize-card" style="flex:1;"><div class="label">2nd Prize</div><div class="number" id="second-${companyKey}">${data['2nd'] || data.second || data.prize2 || '----'}</div></div>
                                <div class="prize-card" style="flex:1;"><div class="label">3rd Prize</div><div class="number" id="third-${companyKey}">${data['3rd'] || data.third || data.prize3 || '----'}</div></div>
                            </div>
                        </div>`;

                    if (companyKey === 'sabah' && data['3d'] && (data['3d']['1st'] || data['3d']['2nd'] || data['3d']['3rd'])) {
                        html += `<div class="subsection"><div class="subsection-title">3D</div>`;
                        html += `<div style="display:flex;gap:8px;justify-content:center;">`;
                        html += `<div class="prize-card" style="flex:1;"><div class="label">1st</div><div class="number">${data['3d']['1st'] || '---'}</div></div>`;
                        html += `<div class="prize-card" style="flex:1;"><div class="label">2nd</div><div class="number">${data['3d']['2nd'] || '---'}</div></div>`;
                        html += `<div class="prize-card" style="flex:1;"><div class="label">3rd</div><div class="number">${data['3d']['3rd'] || '---'}</div></div>`;
                        html += `</div></div>`;
                    }

                    // 特别奖（过滤无效项，保持10个位置）
                    html += `<div class="subsection"><div class="subsection-title">特别奖 SPECIAL</div><div class="number-list" id="special-${companyKey}">`;
                    const specialRaw = data.special || data.special_numbers || data.special_prizes || data.special_results || [];
                    const specialValid = filterValidNumbers(specialRaw);
                    for (let i = 0; i < 10; i++) {
                        if (i < specialValid.length) {
                            html += `<span class="number-item">${specialValid[i]}</span>`;
                        } else {
                            html += `<span class="number-item">----</span>`;
                        }
                    }
                    html += `</div></div>`;

                    // 安慰奖（过滤无效项，保持10个位置）
                    html += `<div class="subsection"><div class="subsection-title">安慰奖 CONSOLATION</div><div class="number-list" id="consolation-${companyKey}">`;
                    const consolationRaw = data.consolation || data.consolation_numbers || data.consolation_prizes || data.consolation_results || [];
                    const consolationValid = filterValidNumbers(consolationRaw);
                    for (let i = 0; i < 10; i++) {
                        if (i < consolationValid.length) {
                            html += `<span class="number-item">${consolationValid[i]}</span>`;
                        } else {
                            html += `<span class="number-item">----</span>`;
                        }
                    }
                    html += `</div></div>`;

                    if (companyKey === 'grand_dragon' && data.jackpot) {
                        html += `<div class="subsection"><div class="subsection-title">Jackpot</div><div class="number-list"><span class="number-item">${data.jackpot}</span></div></div>`;
                    }
                }
            }

            contentDiv.innerHTML = html;
        }

        // ==================== 顶部日历按钮更新函数 ====================
        function updateCalendarButtonDate() {
            const btn = document.getElementById('calendar-btn');
            if (!btn) return;
            if (selectedDate) {
                const display = formatDisplayDate(selectedDate);
                btn.innerHTML = `<span class="calendar-icon">📅</span><span>${display}</span><span class="arrow">▼</span>`;
            } else {
                btn.innerHTML = `<span class="calendar-icon">📅</span><span>加载中...</span><span class="arrow">▼</span>`;
            }
        }

        // ==================== 创建卡片骨架 ====================
        function createCompanySkeletons() {
            const grid = document.getElementById('companies-grid');
            grid.innerHTML = '';
            COMPANY_LIST.forEach(companyKey => {
                const imageFile = COMPANY_IMAGE_MAP[companyKey];
                let titleHtml = NAME_MAP[companyKey];
                if (imageFile) {
                    titleHtml = `${NAME_MAP[companyKey]} <img src="images/${imageFile}" alt="${companyKey} logo" onerror="this.style.display='none'">`;
                }
                const hiddenClass = HIDDEN_COMPANIES.includes(companyKey) ? 'hidden-company' : '';
                grid.innerHTML += `
                    <div class="company-section ${hiddenClass}" id="company-${companyKey}" data-company="${companyKey}">
                        <div class="company-title">${titleHtml}</div>
                        <div class="draw-date" id="meta-${companyKey}">日期 Date: -- | 期号 Draw Date: --</div>
                        <div class="company-content" id="content-${companyKey}"></div>
                    </div>`;
            });
        }

        async function loadAllCompanies() {
            const statusText = document.getElementById('status-text');
            statusText.innerHTML = '<span class="status-indicator loading"></span>正在更新...';
            const promises = COMPANY_LIST.map(key => loadCompanyData(key));
            await Promise.all(promises);
            statusText.innerHTML = `<span class="status-indicator success"></span>数据已加载`;
            document.getElementById('update-time').innerText = new Date().toLocaleString();
        }

        function forceRefresh() {
            loadAllCompanies();
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', async () => {
            await loadDateIndex();
            createCompanySkeletons();
            
            document.getElementById('calendar-btn').onclick = showCalendar;
            
            loadAllCompanies();
            
            document.addEventListener('click', (e) => {
                const calendarPopup = document.getElementById('calendar-popup');
                const calendarBtn = document.getElementById('calendar-btn');
                const dateDropdown = document.getElementById('date-dropdown');

                if (calendarPopup.style.display === 'block' && !calendarPopup.contains(e.target) && !calendarBtn.contains(e.target)) {
                    calendarPopup.style.display = 'none';
                }

                if (dateDropdown.classList.contains('show') && !dateDropdown.contains(e.target)) {
                    dateDropdown.classList.remove('show');
                    document.getElementById('date-btn').classList.remove('active');
                }
            });
        });
    </script>
</body>
